<div class="fd-report"><h2>freshdata strategy comparison</h2><div class="fd-meta">strategy diff grid</div><div class="fd-controls"><input data-col="0" placeholder="filter column…" oninput="fdFilter_fd-cmp-plans()"><input data-col="1" placeholder="filter strategy…" oninput="fdFilter_fd-cmp-plans()"></div><table class="fd-table" id="fd-cmp-plans"><thead><tr><th>column</th><th>strategy</th><th>missing_model</th><th>outlier_action</th><th>n_outliers</th></tr></thead><tbody><tr><td>email</td><td>balanced</td><td>preserve</td><td></td><td>0</td></tr><tr><td>revenue</td><td>balanced</td><td></td><td></td><td>5</td></tr><tr><td>tier</td><td>balanced</td><td>sentinel</td><td></td><td>0</td></tr><tr><td>email</td><td>aggressive</td><td>preserve</td><td></td><td>0</td></tr><tr><td>revenue</td><td>aggressive</td><td></td><td></td><td>5</td></tr><tr><td>tier</td><td>aggressive</td><td>sentinel</td><td></td><td>0</td></tr></tbody></table><script>function fdFilter_fd-cmp-plans(){var t=document.getElementById('fd-cmp-plans');var inp=t.parentNode.querySelectorAll('.fd-controls input');var rows=t.tBodies[0].rows;for(var i=0;i<rows.length;i++){var show=true;inp.forEach(function(b){var c=+b.dataset.col,q=b.value.toLowerCase();if(q&&rows[i].cells[c].innerText.toLowerCase().indexOf(q)<0)show=false;});rows[i].style.display=show?'':'none';}}</script></div>
