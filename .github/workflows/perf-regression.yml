name: Performance regression

# Nightly (and release-candidate) T5 perf gate: runtime slowdown <= 20% and
# memory overhead <= 15% versus the cached v1.0-equivalent baseline.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Re-pin the perf baseline to this run"
        type: boolean
        default: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[bench]"
      - name: Restore perf baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/cleanbench/results/baseline_v1.json
          key: cleanbench-baseline-${{ runner.os }}-v1
      - name: T5 perf gate
        run: |
          EXTRA=""
          if [ "${{ inputs.update_baseline }}" = "true" ]; then EXTRA="--update-baseline"; fi
          python -m benchmarks.cleanbench --tracks T5 --check-gates $EXTRA || true
      - name: Profile T5 default path (probe only)
        run: |
          python - <<'PY'
          import cProfile, pstats, sys, time
          sys.path.insert(0, "src")
          import freshdata as fd
          from benchmarks.cleanbench import fixtures
          truth, corrupted, kwargs = fixtures.make_t5_scale_fixture(target_rows=50_000)
          t0 = time.perf_counter(); fd.clean(corrupted, return_report=True, **kwargs)
          print(f"warmup clean: {time.perf_counter()-t0:.4f}s")
          pr = cProfile.Profile(); pr.enable()
          fd.clean(corrupted, return_report=True, **kwargs)
          pr.disable()
          rows = []
          for (fn, line, name), (cc, nc, tt, ct, callers) in pstats.Stats(pr).stats.items():
              if "freshdata" in fn and "site-packages" not in fn:
                  rows.append((ct, tt, nc, f"{fn.split('freshdata')[-1]}:{line}:{name}"))
          rows.sort(reverse=True)
          print("=== top freshdata functions by cumtime ===")
          for ct, tt, nc, k in rows[:40]:
              print(f"{ct:8.3f} cum {tt:7.3f} tot {nc:>8} calls  {k}")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: benchmarks/cleanbench/results/latest.*
          retention-days: 30
      - name: Open/refresh alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "nightly perf-regression gate failing";
            const body = `The scheduled T5 performance-regression gate failed ` +
              `(runtime > 120% or memory > 115% of baseline).\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "nightly-failure",
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["nightly-failure"],
              });
            }
