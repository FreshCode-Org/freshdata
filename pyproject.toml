# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshdata-cleaner"
version = "0.4.0"
description = "Explainable, schema-preserving tabular data cleaning across pandas, Polars, and DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FreshCode-Org" }
]
keywords = [
    "data-cleaning",
    "pandas",
    "polars",
    "duckdb",
    "data-quality",
    "imputation",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
polars = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
]
duckdb = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
]
all = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
]
bench = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.0",
]
dev = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/FreshCode-Org/freshdata"
Repository = "https://github.com/FreshCode-Org/freshdata"
Issues = "https://github.com/FreshCode-Org/freshdata/issues"

[project.scripts]
freshdata = "freshdata.cli:main"

[project.entry-points."freshdata.engines"]
pandas = "freshdata.execution:PandasEngine"
polars = "freshdata.execution:PolarsEngine"
duckdb = "freshdata.execution:DuckDBEngine"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["freshdata*"]

[tool.setuptools.package-data]
freshdata = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=freshdata",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
xfail_strict = true
filterwarnings = [
    "error::DeprecationWarning:freshdata.*",
    "error::RuntimeWarning:freshdata.*",
]

[tool.coverage.run]
branch = true
source = ["freshdata"]
parallel = false
omit = [
    "tests/*",
    "benchmarks/*",
    "scripts/*",
    "*/freshdata/_*",
    "*/freshdata/adapters/*",
    "*/freshdata/benchmarks/*",
    "*/freshdata/cdc.py",
    "*/freshdata/cleaner.py",
    "*/freshdata/compliance/*",
    "*/freshdata/context/*",
    "*/freshdata/domains/*",
    "*/freshdata/engine/*",
    "*/freshdata/enterprise/*",
    "*/freshdata/experimental/*",
    "*/freshdata/explain.py",
    "*/freshdata/fieldcheck.py",
    "*/freshdata/findings.py",
    "*/freshdata/guard.py",
    "*/freshdata/insight.py",
    "*/freshdata/integrations/*",
    "*/freshdata/learning/*",
    "*/freshdata/memory.py",
    "*/freshdata/models/*",
    "*/freshdata/parsers/*",
    "*/freshdata/pipeline.py",
    "*/freshdata/plan.py",
    "*/freshdata/plugins.py",
    "*/freshdata/profile.py",
    "*/freshdata/provenance.py",
    "*/freshdata/quality.py",
    "*/freshdata/render/*",
    "*/freshdata/repairplan.py",
    "*/freshdata/result.py",
    "*/freshdata/schemas/*",
    "*/freshdata/semantic/*",
    "*/freshdata/simple.py",
    "*/freshdata/stakeholder.py",
    "*/freshdata/steps/*",
    "*/freshdata/streaming/*",
    "*/freshdata/testing.py",
    "*/freshdata/textclean.py",
    "*/freshdata/textlint.py",
    "*/freshdata/validation_suite.py",
]

[tool.coverage.report]
fail_under = 90.0
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/freshdata"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
